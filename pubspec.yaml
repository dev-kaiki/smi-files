name: sml_files
description: Aplicativo SMI para gerenciamento de mídias de OS
publish_to: "none"

version: 1.3.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ----------- SUPABASE -----------
  supabase_flutter: ^2.5.6

  # ----------- MÍDIAS --------------
  image_picker: ^1.1.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.6
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  video_compress: ^3.1.3
  file_picker: ^8.0.0
  video_player: ^2.9.2

  # ----------- PDF ----------------
  pdf: ^3.11.0
  printing: ^5.13.0
  http: ^1.2.0
  image: ^4.3.0

  # ----------- UTILIDADES ---------
  # Com acento circunflexo, nao pino exato: o flutter_localizations muda a
  # versao de intl que exige a cada Flutter (3.41 fixa 0.20.2, 3.47 pede
  # ^0.20.3). Um pino exato aqui casa com uma dessas e falha na outra, e
  # o projeto passa a so resolver na maquina de quem escreveu o pino.
  intl: ^0.20.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/